{% extends "base.html" %}

{% block title %}404 — страница не найдена{% endblock title %}

{% block content %}
<main>
  <section class="container my-5 px-4 text-center">
    <h1 class="mb-4">Ты не пройдёшь!</h1>
    <p class="lead">Если тут что-то было, теперь этого тут нет.</p>
    <p class="mb-4">
      <a href="{{ url_for('views.index_view') }}">Вернуться на главную</a>
    </p>
    <img
      class="img-fluid mx-auto d-block"
      src="{{ url_for('static', filename='img/404.png') }}"
      alt="404"
      style="max-width: 320px;"
    />
  </section>
</main>
{% endblock content %}
